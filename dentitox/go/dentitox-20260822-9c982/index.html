<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting...</title>
<script>
  // Fragment-preserving redirect. A real browser navigation (not a server
  // side 301) keeps a #aff=... fragment intact, which a plain HTTP redirect
  // or link-shortener would usually strip.
  window.location.replace("https://dentitox24.com/text.php#aff=John1122");
</script>
</head>
<body>
  <p>Redirecting to the guide... if nothing happens, <a href="https://dentitox24.com/text.php#aff=John1122">click here</a>.</p>
</body>
</html>
